name: Windows Build and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install pyinstaller

      - name: Build executable
        working-directory: app
        shell: cmd
        run: build.bat

      - name: Verify artifact
        shell: powershell
        run: |
          $exe = 'app/dist/MigrateKit.exe'
          if (-not (Test-Path $exe)) { throw "Build did not produce $exe" }
          Get-FileHash $exe -Algorithm SHA256 | Format-List
          Get-Item $exe | Select-Object FullName,Length,LastWriteTime

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: MigrateKit-Windows
          path: app/dist/MigrateKit.exe
          if-no-files-found: error

      - name: Publish v1.0.0 release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: MigrateKit v1.0.0
          generate_release_notes: true
          prerelease: false
          files: app/dist/MigrateKit.exe
