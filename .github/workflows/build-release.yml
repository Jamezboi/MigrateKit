name: Windows Build and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install pyinstaller

      - name: Build MigrateKit 1.2.2 onedir
        working-directory: app
        shell: cmd
        run: build.bat

      - name: Verify onedir runtime
        shell: powershell
        run: |
          $exe = 'app/dist/MigrateKit/MigrateKit.exe'
          $zip = 'app/MigrateKit-1.2.2-Windows.zip'
          if (-not (Test-Path $exe)) { throw "Missing launcher: $exe" }
          if (-not (Test-Path $zip)) { throw "Missing package: $zip" }
          $files = (Get-ChildItem 'app/dist/MigrateKit' -Recurse -File).Count
          if ($files -lt 10) { throw "Onedir runtime unexpectedly contains only $files files" }
          $hash = Get-FileHash $exe -Algorithm SHA256
          Write-Host "Launcher SHA256: $($hash.Hash)"
          Write-Host "Runtime files: $files"
          Write-Host "Package size: $((Get-Item $zip).Length) bytes"

      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: MigrateKit-Windows-1.2.2
          path: app/MigrateKit-1.2.2-Windows.zip
          if-no-files-found: error

      - name: Publish v1.2.2 release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.2
          name: MigrateKit v1.2.2
          generate_release_notes: true
          prerelease: false
          files: app/MigrateKit-1.2.2-Windows.zip
